}

function tileSolid(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return true;
  const v = grid[ty * GW + tx];
  if (v === 1 || v === 2) return true;
  if (v === 3) return !doorAt[ty * GW + tx].open;

}
function los(x0, y0, x1, y1) {
  let tx = Math.floor(x0 / T), ty = Math.floor(y0 / T);
  const ex = Math.floor(x1 / T), ey = Math.floor(y1 / T);
  if (tx === ex && ty === ey) return true;
  const dx = x1 - x0, dy = y1 - y0, sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
  const tdx = dx !== 0 ? Math.abs(T / dx) : 1e9, tdy = dy !== 0 ? Math.abs(T / dy) : 1e9;
  let tmx = dx !== 0 ? (sx > 0 ? (tx + 1) * T - x0 : x0 - tx * T) / Math.abs(dx) : 1e9;
  let tmy = dy !== 0 ? (sy > 0 ? (ty + 1) * T - y0 : y0 - ty * T) / Math.abs(dy) : 1e9;
  for (let n = 0; n < 300; n++) {
    if (tmx < tmy) { tmx += tdx; tx += sx; } else { tmy += tdy; ty += sy; }
    if (tx === ex && ty === ey) return true;
    if (tileSolid(tx, ty)) return false;

}
// distance a ray travels before hitting something solid (for wave occlusion)
function rayDist(x0, y0, dx, dy, R) {
  let tx = Math.floor(x0 / T), ty = Math.floor(y0 / T);
  const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1, ax = Math.abs(dx), ay = Math.abs(dy);
  const tdx = ax > 1e-9 ? T / ax : 1e9, tdy = ay > 1e-9 ? T / ay : 1e9;
  let tmx = ax > 1e-9 ? (sx > 0 ? (tx + 1) * T - x0 : x0 - tx * T) / ax : 1e9;
  let tmy = ay > 1e-9 ? (sy > 0 ? (ty + 1) * T - y0 : y0 - ty * T) / ay : 1e9;
  for (let n = 0; n < 200; n++) {
    let t;
    if (tmx < tmy) { t = tmx; tmx += tdx; tx += sx; } else { t = tmy; tmy += tdy; ty += sy; }
    if (t > R) return R;
    if (tileSolid(tx, ty)) return t;
  }
  return R;
}

  const n = Math.round(clamp(R / 4.5, 40, 260)), pts = new Float32Array(n * 2);

    text(WEAP[w].name, x + 50 * S, by + 18 * S, 9 * S, C, .7, 'center', 700, `${3 * S}px`);
    if (w !== 'knife') {
      const st = P.ammo[w];
      text(`${st.mag}`, x + 170 * S, by - 6 * S, 34 * S, st.mag === 0 ? CARR[1] : Wt, .95, 'right', 400, '0px', MONO);
      text(`/${st.res}`, x + 174 * S, by - 1 * S, 15 * S, Wt, .5, 'left', 400, '0px', MONO);
      const mag = WEAP[w].mag, pwid = Math.min(6 * S, 150 * S / mag);
      for (let i = 0; i < mag; i++) {
        const on = i < st.mag, px = x + 106 * S + i * pwid;
        ctx.fillStyle = rgba(on ? Wt : Wt, on ? .75 : .1);
        ctx.fillRect(px, by + 14 * S, Math.max(1.5, pwid - 2 * S), 7 * S);
      }
      if (P.reload > 0) {
        const k = 1 - P.reload / WEAP[w].rl;
        text('RELOADING', x + pw / 2, by - 46 * S, 11 * S, A, .7 + .3 * Math.sin(realT * 12), 'center', 700, `${3 * S}px`);
        ctx.fillStyle = rgba(A, .2); ctx.fillRect(x, by - 36 * S, pw, 2);
        ctx.fillStyle = rgba(A, .95); ctx.fillRect(x, by - 36 * S, pw * k, 2);
      } else if (st.mag === 0) text(st.res > 0 ? '[R]  RELOAD' : 'EMPTY', x + pw / 2, by - 46 * S, 11 * S, CARR[1], .95, 'center', 700, `${3 * S}px`);
    } else text('SILENT', x + 180 * S, by - 4 * S, 20 * S, C, .9, 'center', 700, `${5 * S}px`);
    // slots
    SLOTS.forEach((s, i) => {
      const sx = x + i * (pw / 4) + 3 * S, sy = by - 78 * S, swd = pw / 4 - 6 * S, sh = 26 * S;
      const own = P.owned[s], cur = P.weapon === s;
      ctx.fillStyle = cur ? rgba(C, .14) : 'rgba(8,20,28,.4)'; ctx.fillRect(sx, sy, swd, sh);
      ctx.strokeStyle = rgba(cur ? C : Wt, cur ? .9 : own ? .22 : .06); ctx.lineWidth = 1; ctx.strokeRect(sx + .5, sy + .5, swd - 1, sh - 1);
      text(`${i + 1}`, sx + 5 * S, sy + 7 * S, 8 * S, Wt, own ? .7 : .2, 'left', 700);
      if (own) weaponIcon(s, sx + swd / 2 + 3 * S, sy + sh / 2 + 1 * S, .62 * S, cur ? 1 : .4, cur ? C : Wt);
    });
  }
  // ---- message banner
  const mk = realT - msg.t;
  if (mk < 3.2) {
    const a = mk < .15 ? mk / .15 : mk > 2.5 ? 1 - (mk - 2.5) / .7 : 1;
    const n = Math.min(msg.text.length, Math.floor(mk * 70)), s = msg.text.slice(0, n);
    const y = H * .23, sz = 17 * S;
    ctx.font = `700 ${sz}px ${FONT}`; setLS(`${4 * S}px`); const tw = ctx.measureText(msg.text).width; setLS('0px');
    const lw = easeOut(mk / .4) * 90 * S;
    ctx.strokeStyle = rgba(CARR[msg.col], a * .7); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2 - tw / 2 - 16 * S, y); ctx.lineTo(W / 2 - tw / 2 - 16 * S - lw, y); ctx.moveTo(W / 2 + tw / 2 + 16 * S, y); ctx.lineTo(W / 2 + tw / 2 + 16 * S + lw, y); ctx.stroke();
    ctx.fillStyle = `rgba(0,0,0,${a * .5})`; ctx.fillRect(W / 2 - tw / 2 - 12 * S, y - sz * .8, tw + 24 * S, sz * 1.6);
    text(s, W / 2 - tw / 2, y, sz, CARR[msg.col], a, 'left', 700, `${4 * S}px`);
  }
}
function showMsg(t, c) { msg.text = t; msg.t = realT; msg.col = c ?? 3; }
function drawCursor() {
  const x = mouse.x, y = mouse.y, P = player;
  const inGame = state === 'playing' && P && P.x !== undefined;
  const sp = inGame ? 8 + P.spread * .5 : 8;
  ctx.strokeStyle = rgba(CARR[0], .95); ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) { const a = i * PI / 2 + (inGame && P.reload > 0 ? realT * 6 : 0); ctx.moveTo(x + Math.cos(a) * sp, y + Math.sin(a) * sp); ctx.lineTo(x + Math.cos(a) * (sp + 7), y + Math.sin(a) * (sp + 7)); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,1)'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill();
  if (inGame && P.reload > 0) {
    const k = 1 - P.reload / WEAP[P.weapon].rl;
    ctx.strokeStyle = rgba(CARR[2], .9); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, sp + 12, -PI / 2, -PI / 2 + TAU * k); ctx.stroke();
  }
  const hk = (realT - hitMark.t) / (hitMark.kill ? .35 : .18);
  if (hk >= 0 && hk < 1) {
    const s = (hitMark.kill ? 11 : 8) + hk * 4;
    ctx.strokeStyle = hitMark.kill ? rgba(CARR[1], 1 - hk) : `rgba(255,255,255,${1 - hk})`; ctx.lineWidth = hitMark.kill ? 2.4 : 1.8;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) { const a = PI / 4 + i * PI / 2; ctx.moveTo(x + Math.cos(a) * 5, y + Math.sin(a) * 5); ctx.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s); }
    ctx.stroke();
  }
}

// =====================================================================
//  SCREENS
// =====================================================================
function glitchText(s, x, y, size, col, a, align, weight, ls, amt) {
  const j = amt || 0;
  if (j > 0 && Math.random() < .5) {
    ctx.globalCompositeOperation = 'lighter';
    text(s, x - j * rand(1, 3), y, size, CARR[1], a * .6, align, weight, ls);
    text(s, x + j * rand(1, 3), y, size, CARR[0], a * .6, align, weight, ls);
    ctx.globalCompositeOperation = 'source-over';
  }
  text(s, x, y, size, col, a, align, weight, ls);
}
function logo(x, y, s, a) {
  ctx.font = `500 ${96 * s}px ${FONT}`; setLS(`${40 * s}px`);
  const tw = ctx.measureText('ECH').width; setLS('0px');
  const gap = 36 * s;
  glitchText('ECH', x, y, 96 * s, CARR[3], a, 'left', 500, `${40 * s}px`, Math.random() < .04 ? 3 : 0);
  const ox = x + tw + gap + 38 * s;
  ctx.strokeStyle = rgba(CARR[0], a); ctx.lineWidth = 3 * s;
  ctx.beginPath(); ctx.arc(ox, y, 38 * s, 0, TAU); ctx.stroke();
  ctx.lineWidth = 6 * s; ctx.beginPath(); ctx.arc(ox, y, 19 * s, 0, TAU); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    const k = ((realT + i * .8) % 2.4) / 2.4;
    ctx.strokeStyle = rgba(CARR[0], (1 - k) * .55 * a); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ox, y, 38 * s + k * 200 * s, 0, TAU); ctx.stroke();
  }
}
function keycap(x, y, k, w, s) {
  ctx.fillStyle = 'rgba(8,20,28,.8)'; ctx.fillRect(x, y - 11 * s, w, 22 * s);
  ctx.strokeStyle = rgba(CARR[0], .55); ctx.lineWidth = 1; ctx.strokeRect(x + .5, y - 11 * s + .5, w - 1, 22 * s - 1);
  ctx.fillStyle = rgba(CARR[0], .5); ctx.fillRect(x, y + 10 * s, w, 1.5);
  text(k, x + w / 2, y, 11 * s, CARR[3], .95, 'center', 700, '1px');
}
function drawTitle() {
  const s = clamp(Math.min(W / 1400, H / 860), .62, 1.2);
  // darken the left for the menu column
  const g = ctx.createLinearGradient(0, 0, W * .7, 0);
  g.addColorStop(0, 'rgba(0,0,0,.94)'); g.addColorStop(.55, 'rgba(0,0,0,.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const x0 = Math.max(40, W * .07), top = H * .2;
  logo(x0, top, s, 1);
  text("YOU CAN'T SEE THE MAZE.", x0, top + 84 * s, 18 * s, CARR[0], .95, 'left', 600, `${6 * s}px`);
  text('YOU CAN ONLY HEAR IT.', x0, top + 112 * s, 18 * s, CARR[0], .95, 'left', 600, `${6 * s}px`);
  ctx.fillStyle = rgba(CARR[0], .5); ctx.fillRect(x0, top + 138 * s, 40 * s, 1.5);
  const desc = ['A fast top-down action game where sound is your only vision.', 'Every noise reveals the dark for a heartbeat — and tells the', 'blind things hunting you exactly where you are.'];
  desc.forEach((l, i) => text(l, x0, top + 164 * s + i * 22 * s, 15 * s, CARR[3], .7, 'left', 500, '0.5px'));
  // start button
  const bx = x0, byy = top + 250 * s, bw = 300 * s, bh = 50 * s;
  const hov = mouse.x > bx && mouse.x < bx + bw && mouse.y > byy && mouse.y < byy + bh;
  const pulse = .5 + .5 * Math.sin(realT * 3);
  ctx.fillStyle = rgba(CARR[0], hov ? .2 : .07 + .05 * pulse); ctx.fillRect(bx, byy, bw, bh);
  brackets(bx, byy, bw, bh, 12 * s, CARR[0], hov ? 1 : .7, 1.6);
  text('ENTER THE DARK', bx + 24 * s, byy + bh / 2, 20 * s, CARR[3], 1, 'left', 700, `${6 * s}px`);
  ctx.fillStyle = rgba(CARR[0], 1); ctx.beginPath(); const ax = bx + bw - 30 * s + (hov ? 6 * s : 0);
  ctx.moveTo(ax, byy + bh / 2 - 7 * s); ctx.lineTo(ax + 10 * s, byy + bh / 2); ctx.lineTo(ax, byy + bh / 2 + 7 * s); ctx.fill();
  text('LEVEL 01  ·  ' + LV.name + '   ·   🎧 HEADPHONES RECOMMENDED', x0, byy + bh + 22 * s, 11 * s, CARR[3], .45, 'left', 600, `${3 * s}px`);
  // controls panel
  const rows = [
    ['WASD', 'Move — every step is a sound'], ['SHIFT', 'Run — faster, louder'], ['SPACE', 'Dash — brief invulnerability'],
    ['Q', 'Sonar — see all. They hear it too.'], ['CLICK', 'Shoot — lights the room, wakes the house'],
    ['F / RMB', 'Knife — silent. Backstabs kill anything.'], ['E', 'Throw decoy — noise elsewhere'],
    ['1 – 4', 'Switch weapon'], ['R', 'Reload'], ['ESC', 'Pause'],
  ];
  const py = byy + bh + 58 * s, pw = Math.min(W - x0 - 40, 720 * s), ph = 5 * 30 * s + 44 * s;
  panel(x0, py, pw, ph, 1);
  text('CONTROLS', x0 + 16 * s, py + 16 * s, 10 * s, CARR[0], .8, 'left', 700, `${4 * s}px`);
  rows.forEach(([k, v], i) => {
    const col = i % 2, row = i >> 1, x = x0 + 16 * s + col * pw / 2, y = py + 42 * s + row * 30 * s;
    keycap(x, y, k, 72 * s, s);
    text(v, x + 84 * s, y, 13 * s, CARR[3], .75, 'left', 500, '0.3px');
  });
  text('Enemies are blind — but they hear everything. Red outlines show where they WERE, not where they are.', x0, py + ph + 24 * s, 13 * s, CARR[2], .8, 'left', 600, '0.5px');
  let best = 0; try { best = +localStorage.getItem('echo_l1_best') || 0; } catch (e) {}
  if (best) text(`BEST  ${best}`, W - 40, H - 30, 12 * s, CARR[3], .5, 'right', 600, `${4 * s}px`);
  text('ATTRACT FEED  ·  ARCHIVE SUBLEVEL', W - 40, 34, 10 * s, CARR[1], .5 + .3 * Math.sin(realT * 2), 'right', 600, `${3 * s}px`);
}
function drawIntro() {
  const k = time;
  if (k > 4.2) return;
  const a = k < .5 ? k / .5 : k > 3.2 ? 1 - (k - 3.2) : 1;
  const s = Math.min(1.2, W / 1300);
  const lw = easeOut(k / .8) * 200 * s;
  ctx.strokeStyle = rgba(CARR[0], a * .6); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - lw, H * .38 + 26 * s); ctx.lineTo(W / 2 + lw, H * .38 + 26 * s); ctx.stroke();
  glitchText('LEVEL 01', W / 2, H * .38, 46 * s, CARR[3], a, 'center', 600, `${16 * s}px`, k < 1 ? 3 : 0);
  text(LV.name, W / 2, H * .38 + 50 * s, 17 * s, CARR[0], a * .85, 'center', 600, `${10 * s}px`);
  text("Find the keycard. Reach the exit. Stay quiet — or don't.", W / 2, H * .38 + 84 * s, 15 * s, CARR[3], a * .6, 'center', 500, '2px');
}
function overlayDim(a) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); }
function drawDead() {
  const k = Math.min(1, (realT - deathT) / 1.2), s = Math.min(1.2, W / 1300);
  if (realT - deathT < .5) return;
  const k2 = Math.min(1, (realT - deathT - .5) / .6);
  overlayDim(.3 * k);
  glitchText('YOU WERE HEARD.', W / 2, H * .42, 60 * s, CARR[1], k2, 'center', 700, `${12 * s}px`, 3);
  const lw = easeOut(k2) * 260 * s;
  ctx.strokeStyle = rgba(CARR[1], k2 * .6); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W / 2 - lw, H * .42 + 38 * s); ctx.lineTo(W / 2 + lw, H * .42 + 38 * s); ctx.stroke();
  text(checkpoint ? '[R]  RETRY FROM CHECKPOINT' : '[R]  TRY AGAIN', W / 2, H * .42 + 66 * s, 18 * s, CARR[3], k2 * (.6 + .4 * Math.sin(realT * 4)), 'center', 700, `${6 * s}px`);
  text('Red outlines are where they were. Count their footsteps. Ping less.', W / 2, H * .42 + 100 * s, 14 * s, CARR[3], k2 * .5, 'center', 500, '2px');
}
function drawWin() {
  const k = Math.min(1, (realT - winT) / 1), s = Math.min(1.2, Math.min(W / 1300, H / 820));
  overlayDim(.8 * k);
  const r = result, cx = W / 2; let y = H * .15;
  glitchText('LEVEL 01 CLEARED', cx, y, 46 * s, CARR[3], k, 'center', 600, `${12 * s}px`, realT - winT < 1 ? 3 : 0);
  text(LV.name, cx, y + 40 * s, 15 * s, CARR[0], k * .7, 'center', 600, `${8 * s}px`);
  y += 92 * s;
  const px = cx - 260 * s, pw = 520 * s, ph = 10 * 27 * s + 30 * s;
  panel(px, y - 22 * s, pw, ph, k);
  const mm = Math.floor(time / 60), ss = Math.floor(time % 60);
  const rows = [
    ['TIME', `${mm}:${String(ss).padStart(2, '0')}`], ['KILLS', `${stats.kills} / ${r.total}`], ['SILENT KILLS', stats.silent],
    ['SONAR PINGS', stats.pings], ['SHOTS FIRED', stats.shots], ['DAMAGE TAKEN', stats.dmg],
    ['KILL SCORE', stats.score], ['TIME BONUS', '+' + r.timeBonus], ['CLEAN BONUS', '+' + r.clean], ['ALL TARGETS', r.allKill ? '+' + r.allKill : '—'],
  ];
  rows.forEach(([a2, b2], i) => {
    const yy = y + i * 27 * s, kk = clamp((realT - winT - .3 - i * .08) * 4, 0, 1);
    text(a2, px + 24 * s, yy, 14 * s, CARR[3], .55 * kk, 'left', 600, `${4 * s}px`);
    text(String(b2), px + 290 * s, yy, 16 * s, CARR[3], .95 * kk, 'right', 400, '1px', MONO);
  });
  const gx = px + 400 * s, gy = y + 4.3 * 27 * s, gk = clamp((realT - winT - 1.3) * 3, 0, 1);
  hexPath(gx, gy, 70 * s); ctx.strokeStyle = rgba(r.grade === 'S' ? CARR[2] : CARR[0], gk * .7); ctx.lineWidth = 2; ctx.stroke();
  text(r.grade, gx, gy + 4 * s, 110 * s * (1.5 - .5 * gk), r.grade === 'S' ? CARR[2] : CARR[0], gk, 'center', 700);
  text('GRADE', gx, gy - 88 * s, 11 * s, CARR[3], gk * .6, 'center', 600, `${6 * s}px`);
  const fy = y + ph + 10 * s;
  text(`FINAL  ${r.final}`, cx, fy, 28 * s, CARR[2], k, 'center', 400, `${4 * s}px`, MONO);
  if (r.newBest) text('NEW BEST', cx, fy + 30 * s, 13 * s, CARR[0], k * (.6 + .4 * Math.sin(realT * 5)), 'center', 700, `${6 * s}px`);
  text('[R]  PLAY AGAIN      ·      LEVEL 02 — COMING SOON', cx, fy + 62 * s, 15 * s, CARR[3], k * .7, 'center', 600, `${4 * s}px`);
}
function drawPause() {
  overlayDim(.72); const s = Math.min(1.2, W / 1300);
  const pw = 520 * s, ph = 220 * s, px = W / 2 - pw / 2, py = H * .36 - 70 * s;
  panel(px, py, pw, ph, 1);
  text('PAUSED', W / 2, py + 50 * s, 44 * s, CARR[3], 1, 'center', 600, `${16 * s}px`);
  text('[ESC]  RESUME', W / 2, py + 110 * s, 16 * s, CARR[0], .95, 'center', 700, `${5 * s}px`);
  text('[R]  RESTART LEVEL FROM THE BEGINNING', W / 2, py + 144 * s, 14 * s, CARR[3], .6, 'center', 600, `${4 * s}px`);
  text(`[M]  SOUND: ${AU.muted ? 'OFF' : 'ON'}`, W / 2, py + 176 * s, 14 * s, CARR[3], .6, 'center', 600, `${4 * s}px`);
}

// =====================================================================
//  LOOP & INPUT
// =====================================================================
function updAttract(dt) {
  time += dt;
  const t = realT * .05;
  cam.x = GW * T * .55 + Math.sin(t * 1.3) * GW * T * .28;
  cam.y = GH * T * .5 + Math.sin(t * 1.9 + 1) * GH * T * .3;
  attractT -= dt;
  if (attractT <= 0) {
    attractT = rand(.45, .9);
    const cands = floors.filter(f => f.x > cam.x - W / 2 / Z && f.x < cam.x + W / 2 / Z && f.y > cam.y - H / 2 / Z && f.y < cam.y + H / 2 / Z);
    if (cands.length) {
      const f = cands[(Math.random() * cands.length) | 0], c = [0, 0, 0, 1, 2][(Math.random() * 5) | 0];
      emitSound(f.x, f.y, { hear: 0, reveal: rand(420, 800), col: c, owner: 'env', str: 1, force: true });
      if (c === 1) { muzzle(f.x, f.y, rand(0, TAU), false, 1); }
    }
  }
  updReveals(); updFX(dt);
  for (const e of enemies) e.walk += dt * 3;
}
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.033, (now - last) / 1000); last = now; realT += rdt;
  if (!debugFreeze) {
    if (state === 'playing') {
      let s = 1;
      if (hitstop > 0) { hitstop -= rdt; s = .06; } else if (slowT > 0) { slowT -= rdt; s = .35; }
      update(rdt * s); updCamera(rdt);
    } else if (state === 'dead') {
      update(rdt * (realT - deathT < 1.4 ? .25 : .7)); updCamera(rdt);
    } else if (state === 'win') {
      time += rdt; updReveals(); updFX(rdt); updCamera(rdt);
    } else if (state === 'title') updAttract(rdt);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawWorld(false); ctx = plx; plx.setTransform(DPR, 0, 0, DPR, 0, 0); drawTitle(); drawCursor(); ctx = wctx; composite(); requestAnimationFrame(frame); return; }
  drawWorld(true);
  ctx = plx; plx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawIndicators();
  if (state !== 'win') drawHUD(rdt);
  if (state === 'playing') drawIntro();
  if (state === 'dead') drawDead();
  if (state === 'win') drawWin();
  if (state === 'paused') drawPause();
  drawCursor();
  ctx = wctx;
  composite();
  requestAnimationFrame(frame);
}

function startGame(fromCheckpoint) {
  initAudio();
  if (!fromCheckpoint) checkpoint = null;
  buildLevel(fromCheckpoint ? checkpoint : null);
  state = 'playing'; fadeT = realT;
  SFX.ui();
}
addEventListener('keydown', e => {
  const c = e.code;
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  if (e.repeat) { K[c] = true; return; }
  K[c] = true;
  if (c === 'KeyM') { AU.muted = !AU.muted; if (AU.master) AU.master.gain.value = AU.muted ? 0 : .85; return; }
  if (state === 'title') { if (c === 'Enter' || c === 'Space') startGame(false); return; }
  if (state === 'dead' && c === 'KeyR') { startGame(!!checkpoint); return; }
  if (state === 'win' && c === 'KeyR') { startGame(false); return; }
  if (state === 'paused') { if (c === 'Escape' || c === 'KeyP') state = 'playing'; else if (c === 'KeyR') startGame(false); return; }
  if (state === 'playing') {
    if (c === 'Escape' || c === 'KeyP') { state = 'paused'; return; }
    actions.push(c);
  }
});
addEventListener('keyup', e => { K[e.code] = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (state === 'title') { startGame(false); return; }
  initAudio();
  if (e.button === 0) { mouse.down = true; mouse.pressed = true; }
  if (e.button === 2) mouse.rpressed = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { for (const k in K) K[k] = false; mouse.down = false; if (state === 'playing') state = 'paused'; });

resize();
mouse.x = W / 2; mouse.y = H * .7;
buildLevel(null);          // the title screen runs the real level as an attract feed
player.x = -9999; player.y = -9999;
state = 'title';
requestAnimationFrame(frame);
</script>
</body>
