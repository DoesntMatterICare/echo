const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };

const AU = { ctx: null, master: null, echo: null, noise: null, muted: false };
function initAudio() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const A = new AC({ latencyHint: 'interactive' }); AU.ctx = A;
  // master: low cut → a touch of air → glue compressor → brickwall limiter
  const lim = A.createDynamicsCompressor(); lim.threshold.value = -1.5; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .002; lim.release.value = .1; lim.connect(A.destination);
  const glue = A.createDynamicsCompressor(); glue.threshold.value = -20; glue.knee.value = 8; glue.ratio.value = 3; glue.attack.value = .008; glue.release.value = .22; glue.connect(lim);
  const air = A.createBiquadFilter(); air.type = 'highshelf'; air.frequency.value = 9000; air.gain.value = 2; air.connect(glue);
  const cut = A.createBiquadFilter(); cut.type = 'highpass'; cut.frequency.value = 24; cut.connect(air);
  AU.master = A.createGain(); AU.master.gain.value = AU.muted ? 0 : .85; AU.master.connect(cut);
  AU.sfxVol = A.createGain(); AU.sfxVol.connect(AU.master); AU.voVol = A.createGain(); AU.voVol.connect(AU.master); // settings sliders
  AU.sfx = A.createGain(); AU.sfx.connect(AU.sfxVol);                         // everything but dialogue (ducks under it)
  // convolution reverb on a generated room
  AU.echo = A.createGain();
  const pre = A.createDelay(.1); pre.delayTime.value = .022;
  const conv = A.createConvolver(); conv.buffer = makeIR(A, 2.6);
  const rhp = A.createBiquadFilter(); rhp.type = 'highpass'; rhp.frequency.value = 160;
  const rout = A.createGain(); rout.gain.value = .5;
  AU.echo.connect(pre); pre.connect(conv); conv.connect(rhp); rhp.connect(rout); rout.connect(AU.master);
  const len = A.sampleRate * 2, nb = A.createBuffer(1, len, A.sampleRate), ch = nb.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  AU.noise = nb;
  sfxLoad();
}
function outNode(pan, vol, echo, bus) {
  const A = AU.ctx, g = A.createGain(); g.gain.value = vol;
  let last = g;
  if (A.createStereoPanner) { const p = A.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); g.connect(p); last = p; }
  last.connect(bus || AU.sfx || AU.master);
  if (echo > 0) { const e = A.createGain(); e.gain.value = echo; last.connect(e); e.connect(AU.echo); }
  return g;
}
function noise(o) {
  const A = AU.ctx; if (!A || AU.muted || !(o.vol > 0.004)) return;
  const t = A.currentTime + (o.delay || 0), dur = o.dur;
  const src = A.createBufferSource(); src.buffer = AU.noise;
  const f = A.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.8;
  f.frequency.setValueAtTime(o.f0, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  const g = A.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1, t + (o.attack || 0.002)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(outNode(o.pan, o.vol, o.echo ?? 0.3));
  src.start(t, Math.random() * 1.2); src.stop(t + dur + 0.05);
}
function tone(o) {
  const A = AU.ctx; if (!A || AU.muted || !(o.vol > 0.004)) return;
  const t = A.currentTime + (o.delay || 0), dur = o.dur;
  const osc = A.createOscillator(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f0, t); if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  const g = A.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1, t + (o.attack || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(outNode(o.pan, o.vol, o.echo ?? 0.3));
  osc.start(t); osc.stop(t + dur + 0.05);
}
function spat(x, y, range) {
  const dx = x - player.x, dy = y - player.y, d = Math.hypot(dx, dy);
  return { pan: clamp(dx / 420, -1, 1) * 0.85, vol: Math.pow(Math.max(0, 1 - d / range), 1.3) };
}

function revealWave(x, y, R, str, col) {

    const dx = px - x, dy = py - y, d2 = dx * dx + dy * dy;

  for (const p of pickups) if (!p.taken) sch(p, p.x, p.y);
  for (const b of barrels) if (!b.gone) sch(b, b.x, b.y);
  for (const t of traps) if (!t.gone) sch(t, t.x, t.y);
  for (const j of jams) if (!j.gone && j.k === 'node') sch(j, j.x, j.y);
  for (const h of hammers) sch(h, h.x, h.y);

  for (const t of traps) fireReveal(t);

function updPlayer(dt) {
  const P = player;
  P.fireCD -= dt; P.meleeCD -= dt; P.meleeT -= dt; P.sonarCD -= dt; P.dashCD -= dt; P.iframe -= dt;
  P.noise = Math.max(0, P.noise - dt * 380);
  P.recoil = Math.max(0, P.recoil - dt * 9);
  P.spread = Math.max(0, P.spread - dt * 60);
  if (P.dead) return;
  if (P.strike) { updStrike(dt); return; }
  let ix = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0), iy = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0);
  const l = Math.hypot(ix, iy); if (l) { ix /= l; iy /= l; }

  const spd = P.running ? 255 : 150;
  if (P.dashT > 0) {
    P.dashT -= dt; P.vx = P.dvx; P.vy = P.dvy;
    afterimages.push({ x: P.x, y: P.y, a: P.a, t: time, w: P.walk, ma: P.moveA, ph: P.stepPh });
  } else {
    const k = 1 - Math.exp(-dt * 16); P.vx = lerp(P.vx, ix * spd, k); P.vy = lerp(P.vy, iy * spd, k);
  }
  const ox = P.x, oy = P.y;
  moveCircle(P, P.vx * dt, P.vy * dt, P.r, true);
  const moved = Math.hypot(P.x - ox, P.y - oy);
  P.speedNow = moved / Math.max(dt, 1e-4); P.moving = moved > .3;
  P.moveAmt = clamp(lerp(P.moveAmt, P.speedNow / 180, 1 - Math.exp(-dt * 10)), 0, 1.3);
  P.walk += moved * .12;
  P.stepPh = (P.stepPh || 0) + moved * PI / (P.running ? 58 : 46);
  if (P.moveA === undefined) P.moveA = P.a;
  if (P.speedNow > 25) P.moveA = turnTo(P.moveA, Math.atan2(P.vy, P.vx), dt * 14);
  else if (P.moveAmt < .1) P.moveA = turnTo(P.moveA, P.a, dt * 6);
  if (P.moving) P.spread = Math.min(40, P.spread + dt * (P.running ? 60 : 20));
  if (P.dashT <= 0 && l > 0) {
    P.stepAcc += moved;
    const stride = P.running ? 58 : 46;
    if (P.stepAcc > stride) {
      P.stepAcc = 0;
      const gl = glassAt(P.x, P.y);
      if (gl) glassCrunch(gl, P.x, P.y, true, P.running);
      else if (P.running) emitSound(P.x, P.y, { hear: 270, reveal: 215, col: 0, owner: 'player', str: .7, trail: true });
      else emitSound(P.x, P.y, { hear: 100, reveal: 118, col: 0, owner: 'player', str: .5, trail: true });

    }

  P.a = Math.atan2(mw.y - P.y, mw.x - P.x);
  if (P.reload > 0) { P.reload -= dt; if (P.reload <= 0) { P.reload = 0; finishReload(); } }

  for (const p of pickups) if (!p.taken && Math.hypot(p.x - P.x, p.y - P.y) < 28) collect(p);
  if (MS.phase === 'escape' && P.x > exitObj.x0 && P.x < exitObj.x0 + exitObj.w && P.y > exitObj.y0 && P.y < exitObj.y0 + exitObj.h) extract();
}

  const t = Math.min(rx / Math.abs(Math.cos(ang) || 1e-6), ry / Math.abs(Math.sin(ang) || 1e-6));

}
function drawLightTargets(S, pad) {

  for (let i = 0; i < n; i++) {
    const l = lamps[i], cx = x0 + 74 * S + i * 21 * S, r = 6.5 * S;

  glitchText(LV.winTitle, cx, y, 46 * s, CARR[3], k, 'center', 600, `${12 * s}px`, realT - winT < 1 ? 3 : 0);
  text(LV.name, cx, y + 40 * s, 15 * s, CARR[0], k * .7, 'center', 600, `${8 * s}px`);
  y += 92 * s;
  const px = cx - 260 * s, pw = 520 * s, ph = 11 * 27 * s + 30 * s;
  panel(px, y - 22 * s, pw, ph, k);
  const pt = time - (stats.cs || 0), mm = Math.floor(pt / 60), ss = Math.floor(pt % 60);
  const rows = [
    ['TIME', `${mm}:${String(ss).padStart(2, '0')}`], ['KILLS', `${stats.kills} / ${r.total}`], ['SILENT KILLS', stats.silent],
    ['SONAR PINGS', stats.pings], ['SHOTS FIRED', stats.shots], ['DAMAGE TAKEN', stats.dmg],
    [LV.bossName, LV.bossVerb], ['KILL SCORE', stats.score], ['ESCAPE BONUS', '+' + r.escape], ['TIME BONUS', '+' + r.timeBonus], ['CLEAN BONUS', '+' + r.clean],
  ];
  rows.forEach(([a2, b2], i) => {
    const yy = y + i * 27 * s, kk = clamp((realT - winT - .3 - i * .08) * 4, 0, 1);
    text(a2, px + 24 * s, yy, 14 * s, CARR[3], .55 * kk, 'left', 600, `${4 * s}px`);
    text(String(b2), px + 290 * s, yy, 16 * s, CARR[3], .95 * kk, 'right', 400, '1px', MONO);
  });
  const gx = px + 400 * s, gy = y + 4.3 * 27 * s, gk = clamp((realT - winT - 1.3) * 3, 0, 1);
  hexPath(gx, gy, 70 * s); ctx.strokeStyle = rgba(r.grade === 'S' ? CARR[2] : CARR[0], gk * .7); ctx.lineWidth = 2; ctx.stroke();
  text(r.grade, gx, gy + 4 * s, 110 * s * (1.5 - .5 * gk), r.grade === 'S' ? CARR[2] : CARR[0], gk, 'center', 700);
  text('GRADE', gx, gy - 88 * s, 11 * s, CARR[3], gk * .6, 'center', 600, `${6 * s}px`);
  const fy = y + ph + 10 * s;
  text(`FINAL  ${r.final}`, cx, fy, 28 * s, CARR[2], k, 'center', 400, `${4 * s}px`, MONO);
  if (r.newBest) text('NEW BEST', cx, fy + 30 * s, 13 * s, CARR[0], k * (.6 + .4 * Math.sin(realT * 5)), 'center', 700, `${6 * s}px`);
  text(LEVELS[LVI + 1] && !ONLY_L1 ? `[ENTER]  CONTINUE — LEVEL ${LEVELS[LVI + 1].num}      ·      [R]  REPLAY      ·      [T]  TITLE` : '[R]  PLAY AGAIN      ·      [T]  TITLE      ·      ECHO #2 — COMING SOON', cx, fy + 62 * s, 15 * s, CARR[3], k * .7, 'center', 600, `${4 * s}px`);
}
function drawPause() {
  overlayDim(.72); const s = Math.min(1.2, W / 1300);
  const pw = 520 * s, ph = 220 * s, px = W / 2 - pw / 2, py = H * .36 - 70 * s;
  panel(px, py, pw, ph, 1);
  text('PAUSED', W / 2, py + 50 * s, 44 * s, CARR[3], 1, 'center', 600, `${16 * s}px`);
  text('[ESC]  RESUME', W / 2, py + 110 * s, 16 * s, CARR[0], .95, 'center', 700, `${5 * s}px`);
  text('[R]  RESTART LEVEL FROM THE BEGINNING', W / 2, py + 144 * s, 14 * s, CARR[3], .6, 'center', 600, `${4 * s}px`);
  text(`[M]  SOUND: ${AU.muted ? 'OFF' : 'ON'}`, W / 2, py + 176 * s, 14 * s, CARR[3], .6, 'center', 600, `${4 * s}px`);
}

// =====================================================================
//  LOOP & INPUT
// =====================================================================
function updAttract(dt) {
  time += dt;
  const t = realT * .05;
  cam.x = GW * T * .55 + Math.sin(t * 1.3) * GW * T * .28;
  cam.y = GH * T * .5 + Math.sin(t * 1.9 + 1) * GH * T * .3;
  attractT -= dt;
  if (attractT <= 0) {
    attractT = rand(.45, .9);
    const cands = floors.filter(f => f.x > cam.x - W / 2 / Z && f.x < cam.x + W / 2 / Z && f.y > cam.y - H / 2 / Z && f.y < cam.y + H / 2 / Z);
    if (cands.length) {
      const f = cands[(Math.random() * cands.length) | 0], c = [0, 0, 0, 1, 2][(Math.random() * 5) | 0];
      emitSound(f.x, f.y, { hear: 0, reveal: rand(420, 800), col: c, owner: 'env', str: 1, force: true });
      if (c === 1) { muzzle(f.x, f.y, rand(0, TAU), false, 1); }
    }
  }
  updReveals(); updFX(dt);
  for (const e of enemies) e.walk += dt * 3;
}
let last = performance.now();
// a single bad frame must never stop the game: log it and keep the loop alive
let frameErrT = -9;
function frame(now) {
  try { frameBody(now); }
  catch (e) { if (realT - frameErrT > 2) { frameErrT = realT; console.error(e); } ctx = wctx; }
  requestAnimationFrame(frame);
}
function frameBody(now) {
  const rdt = Math.min(.033, (now - last) / 1000); last = now; realT += rdt;
  updAmbience(rdt);
  if (MS) updCallQ();
  if (!debugFreeze) {
    if (state === 'playing') {
      let s = 1;
      if (hitstop > 0) { hitstop -= rdt; s = .06; } else if (slowT > 0) { slowT -= rdt; s = .35; }
      if (!panelHeld()) update(rdt * s); updCamera(rdt);
    } else if (state === 'dead') {
      update(rdt * (realT - deathT < 1.4 ? .25 : .7)); updCamera(rdt);
    } else if (state === 'win') {
      time += rdt; updReveals(); updFX(rdt); updCamera(rdt);
    } else if (state === 'cutscene') updCutscene(rdt);
    else if (state === 'title') updAttract(rdt);
    else if (state === 'briefing') updBriefing(rdt);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'prologue') { mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.fillStyle = '#000'; mctx.fillRect(0, 0, cv.width, cv.height); return; }
  if (state === 'title' || state === 'briefing') { drawWorld(false); ctx = plx; plx.setTransform(DPR, 0, 0, DPR, 0, 0); state === 'title' ? drawTitle() : drawBriefing(); drawCursor(); ctx = wctx; composite(); return; }
  drawWorld(true);
  ctx = plx; plx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state !== 'cutscene') drawIndicators();
  if (state === 'cutscene') drawCutscene(); else if (state !== 'win') drawHUD(rdt);
  if (state === 'playing') drawIntro();
  if (state === 'dead') drawDead();
  if (state === 'win') drawWin();
  if (state === 'paused') drawPause();
  drawCursor();
  ctx = wctx;
  composite();
}

function beginPrologue() {
  initAudio(); voPreload(); stopRain();
  if (LVI !== 0) { setLevel(0); buildLevel(null); player.x = -9999; player.y = -9999; }
  if (!window.EchoPrologue) { startGame(false); return; }
  state = 'prologue';
  window.EchoPrologue.play(() => startGame(false));
}
function startGame(fromCheckpoint) {
  initAudio(); voPreload(); voStopAll();
  CS = null; csHold = 0; // never carry a cutscene across a (re)start
  if (!fromCheckpoint) checkpoint = null;
  buildLevel(fromCheckpoint ? checkpoint : null);
  if (LV.storm) startRain(); else stopRain();
  state = 'playing'; fadeT = realT;
  if (!fromCheckpoint && !introSeen.has(LV.id)) { introSeen.add(LV.id); cutIntro(); } // retries don't replay it
  SFX.ui();
}
addEventListener('keydown', e => {
  const c = e.code;
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  if (e.repeat) { K[c] = true; return; }
  K[c] = true;
  if (c === 'KeyM') { AU.muted = !AU.muted; if (AU.master) AU.master.gain.value = AU.muted ? 0 : SET.master; return; }
  if (state === 'prologue') return;
  if (state === 'cutscene') { if (c === 'Space') csHold = csHold || realT; else if (c === 'Enter' || c === 'Escape') skipCutscene(); return; }
  if (state === 'title') { if (c === 'Enter' || c === 'Space') beginPrologue(); else if (c === 'Digit2' && !ONLY_L1) beginBriefing(1); return; }
  if (state === 'briefing') { if (c === 'Enter' || c === 'Space' || c === 'Escape') finishBriefing(); else if (c === 'ArrowRight') briefNext(); return; }
  if (state === 'dead' && c === 'KeyR') { startGame(!!checkpoint); return; }
  if (state === 'win' && c === 'KeyR') { startGame(false); return; }
  if (state === 'win' && c === 'Enter' && LEVELS[LVI + 1] && !ONLY_L1) { beginBriefing(LVI + 1); return; }
  if ((state === 'win' || state === 'paused') && c === 'KeyT') { toTitle(); return; }
  if (state === 'paused') { pauseKey(c); return; }
  if (state === 'playing') {
    if (c === 'Escape' || c === 'KeyP') { state = 'paused'; PM.i = 0; return; }
    actions.push(c);
  }
});
addEventListener('keyup', e => { K[e.code] = false; if (e.code === 'Space') csHold = 0; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (state === 'title') { const b = TB.b2; if (b && mouse.x > b[0] && mouse.x < b[0] + b[2] && mouse.y > b[1] && mouse.y < b[1] + b[3]) beginBriefing(1); else beginPrologue(); return; }
  if (state === 'briefing') { briefNext(); return; }
  if (state === 'cutscene') { csAdvance(); return; }
  if (state === 'prologue') return;
  if (state === 'paused') { if (e.button === 0) { mouse.down = true; pauseClick(); } return; }
  initAudio();
  if (e.button === 0) { mouse.down = true; mouse.pressed = true; }
  if (e.button === 2) mouse.rpressed = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { for (const k in K) K[k] = false; mouse.down = false; if (state === 'playing') state = 'paused'; });

resize();
mouse.x = W / 2; mouse.y = H * .7;
buildLevel(null);          // the title screen runs the real level as an attract feed
player.x = -9999; player.y = -9999;
state = 'title';
requestAnimationFrame(frame);
</script>
